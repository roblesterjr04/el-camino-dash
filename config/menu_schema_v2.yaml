menu:
  version: 2
  home: home
  pages:
    - id: home
      title: Main Menu
      items:
        - id: bluetooth_page
          label: Bluetooth
          type: submenu
          target_page: bluetooth
          icon: audio
          status_key: bluetooth
        - id: radio_page
          label: Radio
          type: submenu
          target_page: radio
          icon: audio
          status_key: fm_radio
        - id: system_page
          label: System
          type: submenu
          target_page: system
          icon: gear
        - id: alerts_page
          label: Alerts
          type: submenu
          target_page: alerts
          icon: alert
          status_key: fault_status
        - id: wifi_page
          label: Wi-Fi
          type: submenu
          target_page: wifi
          icon: wifi
          status_key: wifi_summary
        - id: diagnostics_page
          label: Diagnostics
          type: submenu
          target_page: diagnostics
          icon: alert
        - id: close_menu
          label: Close menu
          type: action
          command: menu.close
          icon: close

    - id: wifi
      title: Wi-Fi
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: wifi_rescan
          label: Rescan
          type: action
          command: wifi.rescan
          status_key: wifi_summary
        - id: wifi_connect
          label: Connect saved
          type: action
          command: wifi.connect
          status_key: wifi_connection
        - id: wifi_disconnect
          label: Disconnect
          type: action
          command: wifi.disconnect
          status_key: wifi_ip
        - id: wifi_radio_toggle
          label: Toggle Wi-Fi radio
          type: action
          command: wifi.radio_toggle
          status_key: wifi_radio

    - id: bluetooth
      title: Bluetooth
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: bluetooth_connect
          label: Connect
          type: action
          command: bluetooth.connect
          status_key: bluetooth
        - id: bluetooth_disconnect
          label: Disconnect
          type: action
          command: bluetooth.disconnect

    - id: media
      title: Media
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: media_play_pause
          label: Play/Pause
          type: action
          command: media.play_pause
          status_key: media_track
        - id: media_next
          label: Next Track
          type: action
          command: media.next
          status_key: media
        - id: media_stop
          label: Stop
          type: action
          command: media.stop
        - id: media_volume
          label: Volume
          type: range
          config_path: integrations.media.startup_volume
          value_type: float
          min: 0.0
          max: 1.0
          step: 0.05
          apply_mode: immediate
          on_change_command: media.set_volume

    - id: radio
      title: Radio
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: radio_fm_mode
          label: FM Mode
          type: action
          command: radio.fm_mode
          status_key: fm_radio
        - id: radio_wb_mode
          label: Weather Mode (SI4737 only)
          type: action
          command: radio.wb_mode
        - id: radio_seek_up
          label: Seek Up
          type: action
          command: radio.seek_up
        - id: radio_seek_down
          label: Seek Down
          type: action
          command: radio.seek_down
        - id: radio_tune_up
          label: Tune +Step
          type: action
          command: radio.tune_up
        - id: radio_tune_down
          label: Tune -Step
          type: action
          command: radio.tune_down
        - id: radio_scan_cycle
          label: Scan 88.1 +0.2
          type: action
          command: radio.scan_cycle
        - id: radio_mute_toggle
          label: Mute Toggle
          type: action
          command: radio.mute_toggle
        - id: radio_volume
          label: Volume
          type: range
          config_path: integrations.fm_radio.startup_volume
          value_type: int
          min: 0
          max: 63
          step: 1
          apply_mode: immediate
          on_change_command: radio.set_volume
        - id: radio_wb_channel
          label: WB Channel (SI4737 only)
          type: range
          config_path: integrations.fm_radio.wb_channel
          value_type: int
          min: 1
          max: 7
          step: 1
          apply_mode: immediate
          on_change_command: radio.wb_mode

    - id: audio_route
      title: Audio Source
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: audio_source_pi
          label: Select Pi DAC
          type: action
          command: audio.source_pi
          status_key: audio_source
        - id: audio_source_fm
          label: Select FM Radio
          type: action
          command: audio.source_fm
          status_key: audio_source

    - id: inputs
      title: Inputs
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: sim_data_enabled
          label: Simulated Data
          type: toggle
          config_path: inputs.simulated_data.enabled
          apply_mode: immediate
        - id: keyboard_sim_enabled
          label: Keyboard Sim
          type: toggle
          config_path: inputs.keyboard_sim.enabled
          apply_mode: staged

    - id: system
      title: System
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: next_theme
          label: Switch Theme
          type: action
          command: theme.next
          status_key: theme_active
        - id: toggle_center_mode
          label: Toggle Center Dial
          type: action
          command: center_dial_mode.toggle
          status_key: center_dial_mode
        - id: ir_diag_page
          label: IR Diagnostics
          type: submenu
          target_page: ir_diagnostics

    - id: ir_diagnostics
      title: IR Diagnostics
      items:
        - id: back_system
          label: Back
          type: submenu
          target_page: system
        - id: ir_diag_state
          label: Monitor
          type: info
          status_key: ir_diag_state
        - id: ir_last_code
          label: Last Code
          type: info
          status_key: ir_last_code

    - id: diagnostics
      title: Diagnostics
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: diag_pin_state
          label: Diagnostic Pin
          type: info
          status_key: diagnostics_pin_state
        - id: nano_bridge
          label: Nano Bridge
          type: info
          status_key: nano_bridge
        - id: esp32_link
          label: ESP32 Link
          type: info
          status_key: esp32_link
        - id: sensor_pack
          label: Sensor Pack
          type: info
          status_key: sensor_pack
        - id: attiny_power
          label: ATtiny Power
          type: info
          status_key: attiny_power

    - id: alerts
      title: Alerts
      items:
        - id: back_home
          label: Back
          type: submenu
          target_page: home
        - id: fault_active_count
          label: Active
          type: info
          status_key: fault_active_count
        - id: fault_latched_count
          label: Latched
          type: info
          status_key: fault_latched_count
        - id: fault_code_1
          label: Fault 1
          type: info
          status_key: fault_code_1
        - id: fault_code_2
          label: Fault 2
          type: info
          status_key: fault_code_2
        - id: fault_code_3
          label: Fault 3
          type: info
          status_key: fault_code_3
        - id: fault_clear
          label: Clear Faults
          type: action
          command: faults.clear
          status_key: fault_status
