system:
  mode: simulation
  log_level: DEBUG
  target_fps: 30
  window_title: El Camino Dash (Dev)
  startup_sweep_enabled: true
  startup_sweep_up_s: 1.1
  startup_sweep_hold_s: 0.12
  startup_sweep_down_s: 0.7
  left_to_right_preview: true
  left_to_right_spacing_px: 16
  menu_schema_path: config/menu_schema.yaml
  odometer_start_miles: 12345.0
  odometer_persist_enabled: true
  odometer_state_path: data/odometer_state.dev.json
  odometer_write_interval_s: 1.5
  theme_persist_enabled: true
  theme_state_path: data/theme_state.dev.json
  raw_input_log_enabled: true
  raw_input_log_path: data/raw_inputs.dev.log
  raw_input_log_interval_s: 0.2

displays:
  - id: gauge_left
    enabled: true
    shape: round
    width: 540
    height: 540
    position: [0, 0]
    fps: 30
    role: gauge
    gauge_id: speedometer
  - id: gauge_center
    enabled: true
    shape: round
    width: 360
    height: 360
    position: [1080, 0]
    fps: 30
    role: gauge
    gauge_id: fuel
  - id: gauge_right
    enabled: true
    shape: round
    width: 540
    height: 540
    position: [540, 0]
    fps: 30
    role: gauge
    gauge_id: tachometer
  - id: control_rect
    enabled: true
    shape: rectangle
    width: 700
    height: 400
    position: [0, 540]
    fps: 30
    role: control

themes:
  active: default
  allow_fallback: true
  theme_root: themes
  gauge_asset_root: assets/gauges
  font_name: freesansbold.ttf

gauges:
  speedometer: {label: Speed, unit: mph, source: speed_sensor.vehicle_speed, min_value: 0, max_value: 140, smoothing_alpha: 0.2, odometer_source: vehicle.odometer_miles, odometer_label: ODO, odometer_unit: mi, odometer_decimals: 1}
  tachometer: {label: RPM, unit: rpm, source: analog_inputs.engine_rpm, min_value: 0, max_value: 6000, smoothing_alpha: 0.2, secondary_label: Temp, secondary_source: analog_inputs.coolant_temp, secondary_unit: "F"}
  tsps: {label: TSPS, unit: "%", source: analog_inputs.fuel_level, min_value: 0, max_value: 100, smoothing_alpha: 0.3}
  fuel: {label: Fuel, unit: "%", source: analog_inputs.fuel_level, min_value: 0, max_value: 100, smoothing_alpha: 0.3}
  temp: {label: Temp, unit: "F", source: analog_inputs.coolant_temp, min_value: 40, max_value: 250, smoothing_alpha: 0.2}
  amp: {label: Amp, unit: A, source: analog_inputs.system_amp, min_value: -100, max_value: 100, smoothing_alpha: 0.2}
  oil: {label: Oil, unit: "psi", source: analog_inputs.oil_pressure, min_value: 0, max_value: 60, smoothing_alpha: 0.3}

inputs:
  rotary_encoders:
    - {id: menu, enabled: false, pin_a: 17, pin_b: 27, pin_button: 22, pull_up: true, debounce_ms: 3, invert_direction: false, acceleration: 1.0}
    - {id: aux, enabled: false, pin_a: 23, pin_b: 24, pin_button: 25, pull_up: true, debounce_ms: 3, invert_direction: false, acceleration: 1.0}
  analog_inputs:
    - {id: engine_rpm, enabled: false, adc_type: mcp3008, spi_bus: 0, spi_device: 0, channel: 0, min_raw: 0, max_raw: 1023, scale_min: 0, scale_max: 8000}
    - {id: fuel_level, enabled: false, adc_type: mcp3008, spi_bus: 0, spi_device: 0, channel: 1, min_raw: 0, max_raw: 1023, scale_min: 0, scale_max: 100}
    - {id: coolant_temp, enabled: false, adc_type: mcp3008, spi_bus: 0, spi_device: 0, channel: 2, min_raw: 0, max_raw: 1023, scale_min: 100, scale_max: 260}
    - {id: system_amp, enabled: false, adc_type: mcp3008, spi_bus: 0, spi_device: 0, channel: 3, min_raw: 0, max_raw: 1023, scale_min: -100, scale_max: 100}
  speed_sensors:
    - {id: vehicle_speed, enabled: false, gpio_pin: 5, pulses_per_revolution: 20, wheel_circumference_m: 2.1, timeout_ms: 800, smoothing_alpha: 0.35}
  simulated_data:
    enabled: false
    speed_period_s: 8.0
    rpm_period_s: 3.0
    fuel_period_s: 24.0
    temp_period_s: 14.0
    amp_period_s: 5.0
    oil_period_s: 9.0
    speed_range: [0, 95]
    rpm_range: [800, 6000]
    fuel_range: [0, 100]
    temp_range: [40, 250]
    amp_range: [-35, 60]
    oil_range: [8, 62]
  keyboard_sim:
    enabled: true
    rotate_repeat_ms: 130
    rpm_max: 10000
    temp_min: 40
    temp_max: 250
    amp_min: -100
    amp_max: 100
    oil_min: 0
    oil_max: 60
    mappings:
      menu_rotate_left: K_LEFT
      menu_rotate_right: K_RIGHT
      menu_press: K_RETURN
      aux_rotate_left: K_COMMA
      aux_rotate_right: K_PERIOD
      aux_press: K_SLASH
      speed_up: K_w
      speed_down: K_s
      rpm_up: K_e
      rpm_down: K_d
      fuel_up: K_r
      fuel_down: K_f
      temp_up: K_t
      temp_down: K_g
      amp_up: K_y
      amp_down: K_h
      oil_up: K_u
      oil_down: K_j

integrations:
  navit: {enabled: false, executable: navit, args: []}
  media: {enabled: false, music_root: media, startup_track: "", startup_volume: 0.5}
  bluetooth_metadata: {enabled: false, provider: mock}
