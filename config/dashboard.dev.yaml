system:
  mode: simulation
  log_level: DEBUG
  target_fps: 30
  window_title: El Camino Dash (Dev)
  display_render_mode: single_window
  keyboard_focus_control_only: false
  startup_sweep_enabled: true
  startup_sweep_up_s: 1.1
  startup_sweep_hold_s: 0.12
  startup_sweep_down_s: 0.7
  left_to_right_preview: false
  left_to_right_spacing_px: 16
  single_window_fit_desktop: true
  single_window_fit_margin_px: 80
  menu_schema_path: config/menu_schema_v2.yaml
  menu_display_id: gauge_right
  alert_display_id: gauge_center
  alert_overlay_mode: full
  odometer_start_miles: 12345.0
  odometer_persist_enabled: true
  odometer_state_path: data/odometer_state.dev.json
  odometer_write_interval_s: 1.5
  map_view_visible: false
  map_display_id: gauge_right
  simulation_map_image_path: assets/maps/testmap.png
  theme_persist_enabled: true
  theme_state_path: data/theme_state.dev.json
  raw_input_log_enabled: true
  raw_input_log_path: data/raw_inputs.dev.log
  raw_input_log_interval_s: 0.2
  diagnostics_gpio_pin: 21
  diagnostics_gpio_active_low: true
displays:
- id: gauge_left
  enabled: true
  shape: round
  width: 1080
  height: 1080
  position:
  - 0
  - 0
  monitor_index: 0
  windowed: true
  fullscreen: false
  fps: 30
  role: gauge
  gauge_id: speedometer
- id: gauge_center
  enabled: true
  shape: round
  width: 720
  height: 720
  position:
  - 1080
  - 0
  monitor_index: 1
  windowed: true
  fullscreen: false
  fps: 30
  role: gauge
  gauge_id: fuel
- id: gauge_right
  enabled: true
  shape: round
  width: 1080
  height: 1080
  position:
  - 1800
  - 0
  monitor_index: 2
  windowed: true
  fullscreen: false
  fps: 30
  role: gauge
  gauge_id: tachometer
themes:
  active: default
  allow_fallback: true
  theme_root: themes
  gauge_asset_root: assets/gauges
  font_name: freesansbold.ttf
gauges:
  speedometer:
    label: Speed
    unit: mph
    source: speed_sensor.vehicle_speed
    min_value: 0
    max_value: 140
    smoothing_alpha: 0.2
    odometer_source: vehicle.odometer_miles
    odometer_label: ODO
    odometer_unit: mi
    odometer_decimals: 1
  tachometer:
    label: RPM
    unit: rpm
    source: analog_inputs.engine_rpm
    min_value: 0
    max_value: 6000
    smoothing_alpha: 0.2
    secondary_label: Temp
    secondary_source: analog_inputs.coolant_temp
    secondary_unit: F
  tsps:
    label: TSPS
    unit: '%'
    source: analog_inputs.fuel_level
    min_value: 0
    max_value: 100
    smoothing_alpha: 0.3
  fuel:
    label: Fuel
    unit: '%'
    source: analog_inputs.fuel_level
    min_value: 0
    max_value: 100
    smoothing_alpha: 0.3
  temp:
    label: Temp
    unit: F
    source: analog_inputs.coolant_temp
    min_value: 40
    max_value: 250
    smoothing_alpha: 0.2
  amp:
    label: Amp
    unit: A
    source: analog_inputs.system_amp
    min_value: -100
    max_value: 100
    smoothing_alpha: 0.2
  oil:
    label: Oil
    unit: psi
    source: analog_inputs.oil_pressure
    min_value: 0
    max_value: 60
    smoothing_alpha: 0.3
inputs:
  rotary_encoders:
  - id: menu
    enabled: false
    pin_a: 17
    pin_b: 27
    pin_button: 22
    pull_up: true
    debounce_ms: 3
    invert_direction: false
    acceleration: 1.0
  - id: aux
    enabled: false
    pin_a: 23
    pin_b: 24
    pin_button: 25
    pull_up: true
    debounce_ms: 3
    invert_direction: false
    acceleration: 1.0
  analog_inputs:
  - id: engine_rpm
    enabled: false
    adc_type: mcp3008
    spi_bus: 0
    spi_device: 0
    channel: 0
    min_raw: 0
    max_raw: 1023
    scale_min: 0
    scale_max: 8000
  - id: fuel_level
    enabled: false
    adc_type: mcp3008
    spi_bus: 0
    spi_device: 0
    channel: 1
    min_raw: 0
    max_raw: 1023
    scale_min: 0
    scale_max: 100
  - id: coolant_temp
    enabled: false
    adc_type: mcp3008
    spi_bus: 0
    spi_device: 0
    channel: 2
    min_raw: 0
    max_raw: 1023
    scale_min: 100
    scale_max: 260
  - id: system_amp
    enabled: false
    adc_type: mcp3008
    spi_bus: 0
    spi_device: 0
    channel: 3
    min_raw: 0
    max_raw: 1023
    scale_min: -100
    scale_max: 100
  speed_sensors:
  - id: vehicle_speed
    enabled: false
    gpio_pin: 5
    pulses_per_revolution: 20
    wheel_circumference_m: 2.1
    timeout_ms: 800
    smoothing_alpha: 0.35
  mcp23017_controls:
    enabled: false
    i2c_bus: 1
    address: 32
    pull_up: true
    debounce_ms: 60
    button_debounce_ms: 120
    menu_pin_a: 0
    menu_pin_b: 1
    menu_pin_button: 2
    aux_pin_a: 3
    aux_pin_b: 4
    aux_pin_button: 5
    menu_left_pin: 6
    menu_select_pin: 7
    left_delta: 1
  simulated_data:
    enabled: false
    speed_period_s: 8.0
    rpm_period_s: 3.0
    fuel_period_s: 24.0
    temp_period_s: 14.0
    amp_period_s: 5.0
    oil_period_s: 9.0
    speed_range:
    - 0
    - 95
    rpm_range:
    - 800
    - 6000
    fuel_range:
    - 0
    - 100
    temp_range:
    - 160
    - 220
    ambient_period_s: 20.0
    ambient_range:
    - 38
    - 92
    amp_range:
    - -35
    - 60
    oil_range:
    - 8
    - 62
    fault_sim_enabled: true
    fault_cycle_period_s: 5.0
    fault_codes:
    - 1
    - 4
    - 16
    - 128
    - 256
    - 1024
  keyboard_sim:
    enabled: true
    rotate_repeat_ms: 130
    rpm_max: 10000
    temp_min: 40
    temp_max: 250
    ambient_temp_min: -20
    ambient_temp_max: 120
    amp_min: -100
    amp_max: 100
    oil_min: 0
    oil_max: 60
    mappings:
      menu_rotate_left: K_LEFT
      menu_rotate_right: K_RIGHT
      menu_press: K_RETURN
      aux_rotate_left: K_COMMA
      aux_rotate_right: K_PERIOD
      aux_press: K_SLASH
      speed_up: K_w
      speed_down: K_s
      rpm_up: K_e
      rpm_down: K_d
      fuel_up: K_r
      fuel_down: K_f
      temp_up: K_t
      temp_down: K_g
      ambient_up: K_i
      ambient_down: K_k
      amp_up: K_y
      amp_down: K_h
      oil_up: K_u
      oil_down: K_j
  ir_remote:
    enabled: false
    profile_path: config/remotes/remote_1.yaml
    device_path: ''
    device_name: ''
    protocol: nec
    rc_device: rc0
    apply_protocol: true
    allow_repeats: false
    diagnostics_pulse_count: 10
    diagnostics_window_ms: 1500
    diagnostics_max_gap_ms: 180
  sensor_pack_i2c:
    enabled: true
    bus: 1
    address: 18
    register: 0
    frame_len: 16
integrations:
  navit:
    enabled: false
    executable: navit
    args: []
  media:
    enabled: false
    music_root: media
    startup_track: ''
    startup_volume: 0.5
  bluetooth_metadata:
    enabled: false
    provider: mock
  fm_radio:
    enabled: false
    chip: si4703
    i2c_bus: 1
    address: 17
    rst_pin: 5
    startup_mode: fm
    startup_freq_mhz: 101.3
    wb_channel: 1
    startup_volume: 45
    fm_step_mhz: 0.1
  audio_router:
    enabled: false
    chip: pt2314
    protocol: i2c
    i2c_bus: 1
    address: 68
    default_source: pi_dac
    inter_command_delay_s: 0.003
    settle_ms: 8
    sources:
      pi_dac:
        command_bytes:
        - 192
      fm_radio:
        command_bytes:
        - 193
  nano_bridge:
    enabled: true
    port: /dev/serial0
    baudrate: 115200
    write_interval_s: 0.2
  esp32_audio_link:
    enabled: true
    i2c_bus: 1
    address: 42
  attiny_power:
    enabled: true
    request_pin: 16
    confirm_pin: 12
    pull_up: true
