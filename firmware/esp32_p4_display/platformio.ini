; ONE firmware for all three round displays (left speedometer, center, right fuel/oil/temp/charge).
; Each board learns its position at boot from the strap on header pin 17 (GPIO4) on the DigiDash board:
;   J5 left → 1 kΩ to GND, J4 right → 1 kΩ to 3V3, J1 center → open  (see src/display_role.h).
; Off the DigiDash board (bench) the pin is open = center; `role left|center|right` on the serial console stores an
; override, `role auto` clears it. Envs differ only by panel/board, never by position.
;
; Build / flash (from this directory):  ./flash.sh -e display-waveshare3c4 --upload-port /dev/cu.…
; or from firmware/: ./flash_display.sh (ENV=… for other panels).
;
; Center: UTC wall time from GPS RMC on UART2 (GPS_UART_RX / _TX, NEO-6M 9600 8N1; set GPS_UART_BAUD=38400 if
; u-center changed it); local zone from the `tz` setting (no Wi-Fi: the cluster never uses it). Sensor pack UART:
; SENSOR_UART_RX = ATmega TX on every board; only the center transmits (the 0xA5 keepalive on GPIO4, open on J1).
; Regenerate boot splash (800² / 720² / 1024×600): ../../scripts/export_bootscreen_rgb565.py
; Gauge faces are drawn with LVGL (esp32_p4_ui/src/gauges); see ../README.md for the consoles.
;
; Old Homebrew `pio` + pioarduino: use the pip PlatformIO flash.sh installs. "Not a PlatformIO project" → cd here.
; ESP32-P4: GPIO35 low at reset = ROM download mode; monitor_rts/dtr = 0 keep the USB bridge off it.

[platformio]
boards_dir = ../boards

[common]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
framework = arduino
extra_scripts = pre:../scripts/pio_pre_build.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.5
  file://../esp32_p4_common
  file://../esp32_p4_ui
  file://../elc_can
  lvgl/lvgl@8.4.0
build_flags =
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DDISPLAY_ROLE_STRAP_GPIO=4
  -DELC_CAN_TX_PIN=34
  -DELC_CAN_RX_PIN=36
  -DELC_DSI_NUM_FBS=2
  -DGPS_UART_RX=2
  -DGPS_UART_TX=3
  -DGPS_UART_BAUD=9600
  -DWHEEL_CIRCUMFERENCE_M=2.1f
  -DSPEED_PULSES_PER_REV=1.0f
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/../esp32_p4_common/include
  -I${PROJECT_DIR}/../elc_can/include
  -I${PROJECT_DIR}/../esp32_p4_ui/include

; Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C: 800×800 SH8601. Illumination GPIO24, backlight GPIO26 PWM (active low).
; Serial = UART0 = the CH343 USB port used for flashing (console, sensor log, `shot`).
[env:display-waveshare3c4]
extends = common
board = esp32-p4-waveshare-wifi6-touch-lcd-3c4
board_build.chip_variant = esp32p4_es
board_build.flash_mode = qio
board_build.boot = qio
board_build.f_cpu = 360000000L
; TF card: BOARD_SDMMC_SLOT=1 in variants/esp32p4/pins_arduino.h + SD_MMC.setPins in center_sd_settings.cpp.
board_build.variants_dir = variants
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DTSPS_WAVESHARE_3C4=1
  -DTSPS_DSI_DPI_HZ=48000000L
  -DTSPS_BACKLIGHT_PIN=26
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DTSPS_BACKLIGHT_ACTIVE_LOW=1
  -DTSPS_THEME_GPIO=6

; Waveshare 4" 720×720 MIPI (JD9365): same carrier as the 3.4C (Waveshare XC examples), backlight PWM on GPIO26; no PMIC
; answers at 0x45. Rev 3.x P4
; (ROM eco7): the pre-build patch moves the DSI PHY PLL off the pre-v3 clock (esp32_p4_common/scripts).
[env:display-waveshare4c]
extends = common
board = esp32-p4-evboard
; Rev 3 silicon: 400 MHz (360 is an ES-chip clock; setCpuFrequencyMhz rejects it).
board_build.f_cpu = 400000000L
; Its USB-C is the P4's USB-Serial-JTAG (GPIO24 = D-, GPIO25 = D+): Serial is HWCDC there (USB_MODE=1), and the illumination / reverse
; inputs stay off those pins until the DigiDash wiring for this board is settled.
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DELC_ILLUMINATION_GPIO=-1
  -DELC_REVERSE_GPIO=-1
  -DTSPS_USE_JD9365=1
  -DTSPS_BACKLIGHT_PIN=26
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DTSPS_BACKLIGHT_ACTIVE_LOW=1
  -DTSPS_THEME_GPIO=6

; Espressif P4 EV board, square 720×720 JD9165 on the EV DSI (not the stock 7" kit). LCD RST = GPIO27.
[env:display-ev720]
extends = common
board = esp32-p4-evboard
build_flags =
  ${common.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DTSPS_BACKLIGHT_USE_PWM=1

; Espressif P4 EV board with its stock 7" 1024×600 panel.
[env:display-ev7]
extends = env:display-ev720
build_flags =
  ${env:display-ev720.build_flags}
  -DTSPS_PANEL_1024X600=1
