; Minimal ESP32-P4 MIPI display test (no sensors, no TSPS assets).
;
; IMPORTANT — pick the env that matches the PHYSICAL panel:
;   litmus-waveshare-3c4 / *-uart — Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C (800×800 SH8601, 32MB flash, PSRAM). Use this for the 3.4" round sticker.
;   litmus-ev-1024x600 / *-uart   — Stock Espressif EV kit 7" 1024×600 (esp-bsp default).
;   litmus-ev / litmus-ev-uart     — Square 720×720 JD9165 module on the EV DSI connector (NOT the stock 7" kit).
;   litmus-waveshare / *-uart      — Waveshare 4″ 720×720 only (JD9365 + PMIC). NOT the 3.4C — wrong resolution and init.
;
;   cd firmware/esp32_p4_display_litmus
;   ./flash.sh -e litmus-waveshare-3c4 --upload-port /dev/cu.…
;
; Waveshare 3.4C still blank after flash?
;   1) Use the Type-C port wired to the ESP32-P4 USB-UART (silkscreen / wiki). Two Type-C jacks
;      both mention power+flash — wrong port = wrong chip or no download. Unplug the other USB.
;   2) “Factory” flash (full erase + reflash bootloader/app/partition):
;        ./flash.sh --erase-first -e litmus-waveshare-3c4 --upload-port /dev/cu.…
;      Or:  .venv/bin/python -m platformio run -t erase -e litmus-waveshare-3c4 --upload-port …
;           then upload again. There is no separate LCD factory reset — erase_flash clears NVS too.
;   3) Serial 115200: .venv/bin/python -m platformio device monitor -e litmus-waveshare-3c4 --port …
;      If you see “display OK” / red fill but panel black → MIPI/backlight. If “gfx->begin() failed”
;      → init/timing. If no text at all → try -e litmus-waveshare-3c4-uart or litmus-serial-only.
;
; Boot-loop: Illegal instruction @ entry 0x4ffac2c0 + ROM `esp32p4-eco2-*`:
;   • That ROM string is eco2 silicon = chip revision v1.0. IDF/Arduino “v3.00 or newer” prebuilts
;     (chip_variant esp32p4, entry 0x4ffac2c0) are for rev ≥3.1 — they fault on v1.0. Use Arduino
;     “Before v3.00” prebuilts: chip_variant esp32p4_es (entry 0x4ff29ed0). Waveshare 3.4C board JSON
;     sets that. After any chip_variant change: fullclean + erase-first flash.
;
; Environments:
;   litmus-ev-1024x600   — EV board 7" 1024×600, JD9165 timing + GPIO27 RST, USB CDC.
;   litmus-ev-1024x600-uart — Same, UART0 Serial.
;   litmus-ev            — 720×720 JD9165, USB CDC.
;   litmus-waveshare-3c4 — Waveshare 3.4C on-board MIPI (board json: 32MB + PSRAM; Waveshare Arduino demos require PSRAM).
;   litmus-waveshare     — Waveshare 4″ 720×720 (JD9365 + PMIC + init table from esp32_p4_tsps).
;   litmus-ev-uart       — Same as litmus-ev but Serial on UART0 (see below).
;   litmus-waveshare-uart— Same as litmus-waveshare, UART0 Serial.
;   litmus-serial-only   — No display, no GFX; UART0 only. Isolates “monitor / CPU alive” vs MIPI.
;
; If the monitor shows ROM boot + hex garbage but never your sketch lines: USB-CDC and the port you
; opened may differ. Try *-uart or litmus-serial-only, or a second “cu.usbmodem…” / “usbserial” device.
; main.cpp also emits ESP_LOGI — same default console as ROM/panic (often what `pio device monitor` uses).
;
; `rst:0x10 (CHIP_LP_WDT_RESET)` after ROM lines often points at low-power / early init (PSRAM bring-up
; on P4 is a known suspect). Most EV litmus envs use `esp32-p4-evboard-nopsram`. Waveshare 3.4C uses
; `esp32-p4-waveshare-wifi6-touch-lcd-3c4` with BOARD_HAS_PSRAM. ROM `esp32p4-eco2` => rev < v3 =>
; chip_variant esp32p4_es (not esp32p4 post-v3 prebuilts).
;
; Bootloader panic at `entry 0x4ffac2c0` + Illegal instruction: PlatformIO merges your board JSON with
; the platform `esp32-p4-evboard` (engineering-sample `chip_variant=esp32p4_es`). Retail ROM shows
; `esp32p4-eco2` — use `chip_variant=esp32p4` in our `boards/*.json` (done). After changing that,
; run `pio run -t fullclean` then upload so a new bootloader is flashed.

[platformio]
boards_dir = ../esp32_p4_tsps/boards

[env:litmus-ev]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-evboard-nopsram
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
; LITMUS_BACKLIGHT_PIN defaults to 26 in display_init.cpp if unset.

[env:litmus-ev-1024x600]
extends = env:litmus-ev
build_flags =
  ${env:litmus-ev.build_flags}
  -DLITMUS_PANEL_1024X600=1

[env:litmus-ev-1024x600-uart]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-evboard-nopsram
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
  -DLITMUS_PANEL_1024X600=1

[env:litmus-waveshare-3c4]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-waveshare-wifi6-touch-lcd-3c4
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
board_build.chip_variant = esp32p4_es
board_build.flash_mode = qio
board_build.boot = qio
board_build.f_cpu = 360000000L
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLITMUS_WAVESHARE_3C4=1
  -DLITMUS_BACKLIGHT_PIN=26
build_src_filter =
  +<*>
  +<../../esp32_p4_tsps/src/waveshare_3inch4_dsi_800_init.cpp>

[env:litmus-waveshare-3c4-uart]
extends = env:litmus-waveshare-3c4
build_flags =
  ${env:litmus-waveshare-3c4.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0

[env:litmus-waveshare]
extends = env:litmus-ev
build_flags =
  ${env:litmus-ev.build_flags}
  -DLITMUS_USE_JD9365=1
  -DLITMUS_BACKLIGHT_PIN=-1
; Paths are relative to src/ — go up to firmware/, then into sibling esp32_p4_tsps.
build_src_filter =
  +<*>
  +<../../esp32_p4_tsps/src/waveshare_jd9365_720_init.cpp>

[env:litmus-ev-uart]
; Full duplicate so we do not merge CDC=1 (from litmus-ev) with CDC=0.
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-evboard-nopsram
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0

[env:litmus-waveshare-uart]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-evboard-nopsram
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
  -DLITMUS_USE_JD9365=1
  -DLITMUS_BACKLIGHT_PIN=-1
build_src_filter =
  +<*>
  +<../../esp32_p4_tsps/src/waveshare_jd9365_720_init.cpp>

[env:litmus-serial-only]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-evboard-nopsram
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_USB_MODE=0
  -DLITMUS_SERIAL_ONLY=1
build_src_filter = +<main.cpp>
