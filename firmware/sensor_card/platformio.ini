; DigiDash sensor card (SensorCard/): ATmega2560-16AU, 16 MHz, 5 V, CAN node 0x04 through an MCP2515 + MCP2562.
; Build:  pio run                      (the one environment is the firmware that ships)
; Flash:  pio run -t upload --upload-port /dev/cu.usbmodemXXXX     an Arduino Mega 2560 (stk500v2 bootloader)
;         pio run -t upload -e sensorcard_isp --upload-port usb     the card's J6 ISP header (USBasp / AVRISP mkII)
; The card's pins are the Arduino Mega's pins, so the same image runs on a Mega 2560 with a CAN-BUS shield on the
; bench (README.md, "On a Mega and a CAN shield"). There is no bench build.
;
; Shared code is firmware/elc_can (channel framing, message codecs, USB link records), built straight from its
; sources: its library.json is for the ESP32 boards. RAM is the tight resource (8 KB), so the channel buffers are
; cut down (elc_chan.h) and the serial buffers sized for the USB link.
[platformio]
default_envs = sensorcard

[env:sensorcard]
platform = atmelavr@5.3.0
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Os
  -Wall -Wextra -Wno-unused-parameter
  -I ../elc_can/include
  -D SERIAL_RX_BUFFER_SIZE=128
  -D SERIAL_TX_BUFFER_SIZE=128
  -D ELC_CH_PAYLOAD_LIMIT=160
  -D ELC_CH_RX_BUFFERS=3
  -D ELC_CH_RX_DUPS=16
build_src_filter =
  +<*>
  +<../../elc_can/src/elc_chan.cpp>
  +<../../elc_can/src/elc_chan_msg.cpp>
  +<../../elc_can/src/elc_can_codec.cpp>
  +<../../elc_can/src/elc_usb_link.cpp>

; Same image, loaded over ISP into a blank 2560 (no bootloader). Fuses for this one: 16 MHz crystal, JTAG off, boot reset
; off (SensorCard/DATASHEET.md, Fuses and programming):  pio run -e sensorcard_isp -t fuses
; Not a USBtiny: unreliable above 128 KB. A USBasp, AVRISP mkII or Atmel-ICE, with the card powered from its slot.
[env:sensorcard_isp]
extends = env:sensorcard
upload_protocol = usbasp
upload_flags = -Pusb
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFD
