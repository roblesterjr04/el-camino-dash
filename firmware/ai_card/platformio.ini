; AI card front end (AICard/): ESP32-S3-WROOM-1U-N16R8 (16 MB flash, 8 MB octal PSRAM), CAN node 0x14 + slot - 1, product 0x0007.
; Build: pio run          Flash: pio run -t upload --upload-port /dev/cu.usbmodem…   (the card's USB-C; BOOT + RESET if it does not answer)
; Versions are pinned (same platform as the console) so a rebuild months from now produces the same firmware.
; Bring-up without a wake-word model: env ai-card-keyonly (press-to-talk only, no esp-sr).

[env:ai-card]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D AI_WAKE_ENGINE=1
lib_deps =
  file://../elc_can

[env:ai-card-keyonly]
extends = env:ai-card
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D AI_WAKE_ENGINE=0
  ; bench with no main board: take slot 1's node
  -D AI_BENCH_NODE=0x14
