; TSPS cluster + sensor_pack UART for ESP32-P4 (MIPI DSI).
;
; Two LCD stacks (+ EV 7" variant):
;   env:esp32-p4-tsps-waveshare3c4 — Waveshare ESP32-P4-WIFI6-Touch-LCD-3.4C (800×800 SH8601, 32MB+PSRAM board). NOT the 4" 720 kit.
;   env:esp32-p4-tsps              — Square 720×720 JD9165 on EV DSI (NOT the stock 7" kit). LCD RST = GPIO27.
;   env:esp32-p4-tsps-ev7          — Stock Espressif EV kit 7" 1024×600 (esp-bsp default panel). Use if screen stays blank with esp32-p4-tsps.
;   env:esp32-p4-tsps-waveshare4c  — Waveshare 4" 720×720 MIPI (JD9365) only.
;
; Bring-up: flash firmware/esp32_p4_display_litmus (try litmus-ev-1024x600 first on the stock EV kit) until you see red + HELLO, then TSPS.
;
; --- Build / flash (always run from this directory) ---
;   ./flash.sh -e esp32-p4-tsps-waveshare3c4 --upload-port /dev/cu.…
; Full chip erase + flash (after partition changes or odd boot): ./flash.sh --erase-first -e … --upload-port …
; (flash.sh creates .venv and installs requirements.txt — needed on Homebrew Python / PEP 668.)
; Manual:
;   python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
;   .venv/bin/python -m platformio run -t upload --upload-port ...
;
; "Not a PlatformIO project" → you ran `pio` from the repo root; cd here first.
;
; Old Homebrew `pio` (e.g. 6.1.7) + pioarduino: use pip PlatformIO >= 6.1.18 via commands above.
; "No module named 'littlefs'" → pip install -r requirements.txt (installs littlefs-python).
;
; "No space left on device" → free disk space (~/.platformio, .pio/, Xcode/simulator caches).
;
; RISC-V compiler: pre_extra_script.py scans ~/.platformio/{packages,tools}/toolchain-riscv32-esp*
; for bin/riscv32-esp-elf-g++ (pioarduino often puts the real tree under tools/).
;
; Alternative: Arduino IDE 2.x + esp32 core >= 3.2.0 + GFX Library for Arduino.
;
; Regenerate boot splash (assets/bootscreen/boot3.png) → 800², 720², 1024×600 headers:
;   .venv-assets/bin/python ../../scripts/export_bootscreen_rgb565.py
; Regenerate RGB565 assets after theme PNG changes (needs Pillow in a venv):
;   python3 -m venv .venv-assets && .venv-assets/bin/pip install pillow
;   .venv-assets/bin/python ../../scripts/export_tsps_rgb565_assets.py src --edge 480
;   .venv-assets/bin/python ../../scripts/export_tsps_classic1_rgb565_assets.py src --edge 480
;   (default script edge is 480; use --edge 360 for smaller PSRAM use on 720²-only boards)
;
; Waveshare 4" black LCD: env esp32-p4-tsps-waveshare4c runs PMIC I2C (0x45 on SDA=7/SCL=8) + board-specific JD9365 init.
; Waveshare 3.4C: use esp32-p4-tsps-waveshare3c4 (800×800 init + 1500 Mbps/lane). Do not mix with waveshare4c.
; sensor_pack UART: SENSOR_UART_RX = wire from ATmega TX (packets in). SENSOR_UART_TX = wire to ATmega RX (0xA5).
; Defaults RX=GPIO5, TX=GPIO4. Override only if your harness uses different pins.
; Packets arrive ~50ms apart while loop is faster — hold last good readings until link loss: -DSENSOR_PACKET_STALE_MS=400 (default).
; Backlight off: try GPIO 24/23, -DTSPS_BACKLIGHT_ACTIVE_LOW=1, or TSPS_BACKLIGHT_PIN=-1 if hardwired.

[platformio]
boards_dir = boards
; esp32-p4-evboard.json uses chip_variant=esp32p4 (post-v3 prebuilts) for Espressif P4 EV v1.6 / rev3.1+ kits.
; ROM `esp32p4-eco2` (chip rev 1.0) needs esp32p4_es — see esp32-p4-waveshare-wifi6-touch-lcd-3c4.json.

[env:esp32-p4-tsps]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-evboard
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
; ESP32-P4: GPIO35 low at reset = ROM download mode. Many bridges wire DTR→GPIO35;
; opening a serial port can assert DTR/RTS and leave the chip "stuck" in bootloader.
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
  file://../esp32_p4_ui
  lvgl/lvgl@^8.3.11
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/../esp32_p4_common/include
  -I${PROJECT_DIR}/../esp32_p4_ui/include
; TSPS_BACKLIGHT_PIN defaults to 26 in display_setup.cpp if not set here.

[env:esp32-p4-tsps-ev7]
extends = env:esp32-p4-tsps
build_flags =
  ${env:esp32-p4-tsps.build_flags}
  -DTSPS_PANEL_1024X600=1

[env:esp32-p4-tsps-waveshare4c]
extends = env:esp32-p4-tsps
build_flags =
  ${env:esp32-p4-tsps.build_flags}
  -DTSPS_USE_JD9365=1
  -DTSPS_BACKLIGHT_PIN=-1
  -DTSPS_THEME_GPIO=6

[env:esp32-p4-tsps-waveshare3c4]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-waveshare-wifi6-touch-lcd-3c4
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
  file://../esp32_p4_ui
  lvgl/lvgl@^8.3.11
board_build.chip_variant = esp32p4_es
board_build.flash_mode = qio
board_build.boot = qio
board_build.f_cpu = 360000000L
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DTSPS_WAVESHARE_3C4=1
  -DTSPS_BACKLIGHT_PIN=-1
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DTSPS_THEME_GPIO=6
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/../esp32_p4_common/include
  -I${PROJECT_DIR}/../esp32_p4_ui/include
