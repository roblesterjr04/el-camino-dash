; Classic ESP32 (BR/EDR + A2DP). Source: ../../arduino/sketches/esp32_audio_bridge
; Build: pio run -e esp32dev
; Flash: pio run -e esp32dev -t upload
; Optional: USB serial AVRCP line debug — add to build_flags: -D AUDIO_BRIDGE_SERIAL_METADATA=1
;
[platformio]
src_dir = ../../arduino/sketches/esp32_audio_bridge

[env:esp32dev]
build_flags = -D AUDIO_BRIDGE_SERIAL_METADATA=1
platform = espressif32
board = esp32dev
framework = arduino
; A2DP + audio-tools need a larger app region than the default (~1.25 MB).
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
  https://github.com/pschatzmann/ESP32-A2DP.git
  https://github.com/pschatzmann/arduino-audio-tools.git

; Default env uses internal DAC (GPIO25/26). For vehicle I2S → external PCM DAC: `pio run -e esp32dev_external_i2s`
[env:esp32dev_external_i2s]
extends = env:esp32dev
build_flags = -D AUDIO_BRIDGE_USE_INTERNAL_DAC=0
