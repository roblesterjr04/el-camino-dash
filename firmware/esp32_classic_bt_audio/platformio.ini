; Classic ESP32 (BR/EDR + A2DP). Source: ../../arduino/sketches/esp32_audio_bridge
; Build: pio run -e esp32wrover (DevKitC-VE, PSRAM) or esp32dev (the older WROOM DevKitC-32)
; Flash: ./flash.sh --upload-port /dev/cu.… (ENV=esp32wrover_bench on the bench, ENV=esp32dev for the WROOM board)
; Optional: USB serial AVRCP line debug — add -D AUDIO_BRIDGE_SERIAL_METADATA=1 to build_flags.
; CAN: DigiDash slot pinout (TX 32, RX 33 to the slot's MCP2562; slot ID straps 13/23). CAN is the
; link in the car: now-playing, transport and album art. The I2C slaves (0x2A, 0x3E) are bench only:
; flash the `*_bench` env for a bench setup wired to the center's I2C instead.
; Audio: I2S to the external DAC/amp, BCK=14 WS=25 DOUT=27 (override with -D I2S_PIN_*; avoid GPIO 21/22 = I2C).
; Versions are pinned so a rebuild months from now produces the same firmware.
;
[platformio]
src_dir = ../../arduino/sketches/esp32_audio_bridge

[env:esp32dev]
build_flags =
  -D ELC_CAN_TX_PIN=32
  -D ELC_CAN_RX_PIN=33
  -D ELC_CAN_SLOT_ID0_PIN=13
  -D ELC_CAN_SLOT_ID1_PIN=23
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32dev
framework = arduino
; A2DP + audio-tools need a larger app region than the default (~1.25 MB).
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
  file://../elc_can
  https://github.com/pschatzmann/ESP32-A2DP.git#35bace5410cc9926c7d0cf04ffd68fb603a2d724
  https://github.com/pschatzmann/arduino-audio-tools.git#4b6deecbe81a58b7a846e1cfd2d40a92befe35a6
  ; album art: decode the phone's cover and re-encode a 128x128 copy for CAN (art_variants.cpp)
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  https://github.com/bitbank2/JPEGENC.git#f51421bdaba8e098dc82130a17adaae6d61c3377

; Bench: CAN plus the I2C slaves (0x2A metadata + album art, 0x3E theme) for a center built with
; CENTER_AUDIO_I2C=1 (its *_bench envs) and wired straight to this board.
[env:esp32dev_bench]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -D AUDIO_BRIDGE_I2C=1

; ESP32-DevKitC-VE (ESP32-WROVER-E, 8 MB flash, 8 MB PSRAM): the audio DevKit from now on. Same 2x19 pinout as the
; DevKitC-32; GPIO16 / 17 go to the PSRAM (the bridge uses neither). The album-art buffers and the JPEG work go to PSRAM,
; which leaves the internal RAM to Bluetooth, and the small art copy is 128 px (64 px on the WROOM envs above).
[env:esp32wrover]
extends = env:esp32dev
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
build_flags =
  ${env:esp32dev.build_flags}
  -D BOARD_HAS_PSRAM

[env:esp32wrover_bench]
extends = env:esp32wrover
build_flags =
  ${env:esp32wrover.build_flags}
  -D AUDIO_BRIDGE_I2C=1

; The audio carrier (AudioCarrier/, ESP32-PICO-MINI-02-N8R2): PCM1808 microphone ADC on I2S0 data-in GPIO35 with its
; 12.288 MHz / 256 fS master clock on GPIO0, the DACs' soft mute on GPIO4, the second node strap on GPIO22 (the module
; has no GPIO23). The rear DAC (I2S1 slave, GPIO26) is not driven yet.
[env:audiocarrier]
extends = env:esp32wrover
build_flags =
  ${env:esp32wrover.build_flags}
  -D ELC_CAN_SLOT_ID1_PIN=22
  -D I2S_PIN_DIN=35
  -D I2S_PIN_MCLK=0
  -D DAC_UNMUTE_PIN=4
