; MIDDLE gauge: tach + clock (UTC wall time from GPS RMC on UART2; street via Nominatim when Wi‑Fi up).
; SENSOR_UART_RX = ATmega TX; SENSOR_UART_TX = ATmega RX (handshake 0xA5).
; GPS_UART_RX / GPS_UART_TX = NMEA UART2 on UART2. NEO‑6M default is 9600 8N1 (set GPS_UART_BAUD=38400 if u‑center changed it).
; Wire GPS TX → GPS_UART_RX, GPS RX → GPS_UART_TX. Defaults GPIO 2/3 on 40‑pin header; avoid 4/5 (sensor) and 7/8 (I2C).
; Regenerate boot splash (800² / 720² / 1024×600): ../../scripts/export_bootscreen_rgb565.py
; Regenerate: .venv-assets/bin/python ../../scripts/export_center_rgb565_assets.py src --edge 480
;   (+ mpg.png → center_mpg_assets_gen.h)
;
[platformio]
boards_dir = ../boards

[env:esp32-p4-center-waveshare3c4]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-p4-waveshare-wifi6-touch-lcd-3c4
framework = arduino
extra_scripts = pre:../scripts/pio_pre_build.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.5
  file://../esp32_p4_common
  file://../esp32_p4_ui
  lvgl/lvgl@8.4.0
board_build.chip_variant = esp32p4_es
board_build.flash_mode = qio
board_build.boot = qio
board_build.f_cpu = 360000000L
; TF: BOARD_SDMMC_SLOT=1 in variants/esp32p4/pins_arduino.h + SD_MMC.setPins in center_sd_settings.cpp
; Illumination: GPIO24 (ELC_ILLUMINATION). Backlight: GPIO26 PWM (TSPS_BACKLIGHT_PIN); PMIC 0x96 maxed in firmware when PWM BL.
board_build.variants_dir = variants
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DSENSOR_LINK_KEEPALIVE=1
  -DGPS_UART_RX=2
  -DGPS_UART_TX=3
  -DGPS_UART_BAUD=9600
  -DTSPS_WAVESHARE_3C4=1
  -DTSPS_BACKLIGHT_PIN=26
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DTSPS_BACKLIGHT_ACTIVE_LOW=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/../esp32_p4_common/include
  -I${PROJECT_DIR}/../esp32_p4_ui/include

[env:esp32-p4-center-waveshare4c]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-p4-evboard
framework = arduino
extra_scripts = pre:../scripts/pio_pre_build.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.5
  file://../esp32_p4_common
  file://../esp32_p4_ui
  lvgl/lvgl@8.4.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DSENSOR_LINK_KEEPALIVE=1
  -DGPS_UART_RX=2
  -DGPS_UART_TX=3
  -DGPS_UART_BAUD=9600
  -DTSPS_USE_JD9365=1
  -DTSPS_BACKLIGHT_PIN=-1
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DLV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/../esp32_p4_common/include
  -I${PROJECT_DIR}/../esp32_p4_ui/include
