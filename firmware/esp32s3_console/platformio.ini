; Console board (ConsoleBoardRS/): ESP32-S3-WROOM-1-N8 (8 MB flash, no PSRAM), SSD1322 256x64 OLED,
; Select and Volume RetroSound knobs (ADC, the only controls), CAN node 0x13. Serial console on the native USB (USB CDC on boot), 115200.
; Build: pio run          Flash: ./flash.sh --upload-port /dev/cu.usbmodem…
; OLED: SSD1322, NHD init, whole 4-bit frames turned 180° (-D CONSOLE_OLED_ROTATE_180=0 for a module mounted upright).
; A knob that counts the wrong way: -D CONSOLE_SEL_REVERSE=1 (or CONSOLE_VOL_REVERSE).
; Versions are pinned so a rebuild months from now produces the same firmware.

[env:console]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
; two 3.3 MB app slots: the update page and the CAN update write the one not running (../README.md, Firmware updates)
board_build.partitions = default_8MB.csv
; elc_fw.py: ELC_FW_VARIANT = "console", and console.elcfw (the update file) next to firmware.bin
extra_scripts = pre:../scripts/elc_fw.py
custom_elc_product = 0x0003
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ELC_CAN_TX_PIN=5
  -D ELC_CAN_RX_PIN=6
  -D LV_CONF_INCLUDE_SIMPLE
  -I${PROJECT_DIR}/include
lib_deps =
  file://../elc_can
  ; only its font format and glyph lookup (the console draws into its own framebuffer)
  lvgl/lvgl@8.4.0
