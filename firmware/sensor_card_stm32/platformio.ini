; DigiDash sensor card rev B (SensorCard2/): STM32G0B1KBU6, 64 MHz from an 8 MHz crystal, 3.3 V, CAN node 0x04 on the
; chip's own FDCAN1 through a TJA1051T/3. Rev A (SensorCard/, ATmega2560) stays in ../sensor_card.
; Build:  pio run                                   (the one environment is the firmware that ships; no bench build)
; Flash:  pio run -t upload                         J6 SWD with an ST-Link (README.md, "Flashing over SWD")
;
; Framework: the STM32duino Arduino core (Serial, Wire, HardwareTimer, millis, the IWDG library) with ST's HAL, which
; the core ships, called directly for what the core has no API for: the DMA ADC scan and FDCAN1 (README.md says why).
; The board is a custom definition in ../boards: PlatformIO has no generic G0B1KB board.
;
; Shared code is built straight from its sources, one copy for both cards: the portable layers of ../sensor_card/src
; (channels, calibration, odometer + FRAM blocks, frame codecs, the menu page) and ../elc_can (channel framing, the
; message codecs, the USB link records). ELC_USB_PORT_EXTERNAL keeps elc_usb_link.cpp's ESP32 port code out: this
; card's end of the link is src/card_usb.cpp.
[platformio]
default_envs = sensorcard2
boards_dir = ../boards

[env:sensorcard2]
platform = ststm32@20.0.0
board = sensorcard2_g0b1kb
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
build_unflags = -std=gnu++14
build_flags =
  -std=gnu++17
  -Os
  -Wall -Wextra -Wno-unused-parameter
  ; rev A's shared sources trip two newer-GCC truncation warnings on deliberate strncpy / snprintf cut-offs
  -Wno-stringop-truncation -Wno-format-truncation
  -I ../sensor_card/src
  -I ../elc_can/include
  -D HSE_VALUE=8000000U
  ; the core leaves the FDCAN HAL module out unless the sketch asks (stm32yyxx_hal_conf.h, "unused HAL modules")
  -D HAL_FDCAN_MODULE_ENABLED
  -D ELC_USB_PORT_EXTERNAL
  -D SERIAL_UART_INSTANCE=1
  -D PIN_SERIAL_RX=PA10
  -D PIN_SERIAL_TX=PA9
  -D SERIAL_RX_BUFFER_SIZE=256
  -D SERIAL_TX_BUFFER_SIZE=256
  -D ELC_CH_PAYLOAD_LIMIT=256
  -D ELC_CH_RX_BUFFERS=6
  -D ELC_CH_RX_DUPS=48
build_src_filter =
  +<*>
  +<../../sensor_card/src/calib.cpp>
  +<../../sensor_card/src/odometer.cpp>
  +<../../sensor_card/src/engine.cpp>
  +<../../sensor_card/src/card_net.cpp>
  +<../../sensor_card/src/card_ui.cpp>
  +<../../sensor_card/src/card_chan.cpp>
  +<../../sensor_card/src/legacy.cpp>
  +<../../elc_can/src/elc_chan.cpp>
  +<../../elc_can/src/elc_chan_msg.cpp>
  +<../../elc_can/src/elc_can_codec.cpp>
  +<../../elc_can/src/elc_usb_link.cpp>
