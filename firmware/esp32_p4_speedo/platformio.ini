; LEFT gauge: speedometer only. Wheel math matches config/dashboard.yaml defaults.
; SENSOR_UART_RX = ATmega TX; SENSOR_UART_TX = ATmega RX (handshake 0xA5).
; Regenerate boot splash (800² / 720² / 1024×600): ../../scripts/export_bootscreen_rgb565.py
; Gauge faces are drawn with LVGL (esp32_p4_ui/src/gauges); bench console: shot | perf | demo on|off | theme 0|1|2.
;
[platformio]
boards_dir = ../boards

[env:esp32-p4-speedo-waveshare3c4]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-p4-waveshare-wifi6-touch-lcd-3c4
framework = arduino
extra_scripts = pre:../scripts/pio_pre_build.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.5
  file://../esp32_p4_common
  file://../esp32_p4_ui
  lvgl/lvgl@8.4.0
board_build.chip_variant = esp32p4_es
board_build.flash_mode = qio
board_build.boot = qio
board_build.f_cpu = 360000000L
; Illumination: GPIO24 (ELC_ILLUMINATION). Backlight: GPIO26 PWM (TSPS_BACKLIGHT_PIN); PMIC 0x96 maxed in firmware when PWM BL.
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DELC_DSI_NUM_FBS=2
  -DLV_CONF_INCLUDE_SIMPLE
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DTSPS_WAVESHARE_3C4=1
  -DTSPS_DSI_DPI_HZ=48000000L
  -DTSPS_BACKLIGHT_PIN=26
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DTSPS_BACKLIGHT_ACTIVE_LOW=1
  -DWHEEL_CIRCUMFERENCE_M=2.1f
  -DSPEED_PULSES_PER_REV=1.0f
  -I${PROJECT_DIR}/../esp32_p4_common/include
  -I${PROJECT_DIR}/../esp32_p4_ui/include

[env:esp32-p4-speedo-waveshare4c]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.312-1
board = esp32-p4-evboard
framework = arduino
extra_scripts = pre:../scripts/pio_pre_build.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ 1.6.5
  file://../esp32_p4_common
  file://../esp32_p4_ui
  lvgl/lvgl@8.4.0
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DELC_DSI_NUM_FBS=2
  -DLV_CONF_INCLUDE_SIMPLE
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DTSPS_USE_JD9365=1
  -DTSPS_BACKLIGHT_PIN=-1
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DWHEEL_CIRCUMFERENCE_M=2.1f
  -DSPEED_PULSES_PER_REV=1.0f
  -I${PROJECT_DIR}/../esp32_p4_common/include
  -I${PROJECT_DIR}/../esp32_p4_ui/include
