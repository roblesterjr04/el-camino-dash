; LEFT gauge: speedometer only. Wheel math matches config/dashboard.yaml defaults.
; SENSOR_UART_RX = ATmega TX; SENSOR_UART_TX = ATmega RX (handshake 0xA5).
; Regenerate boot splash (800² / 720² / 1024×600): ../../scripts/export_bootscreen_rgb565.py
; Regenerate: .venv-assets/bin/python ../../scripts/export_speedo_rgb565_assets.py src --edge 480
;
[platformio]
boards_dir = ../esp32_p4_tsps/boards

[env:esp32-p4-speedo-waveshare3c4]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-waveshare-wifi6-touch-lcd-3c4
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
board_build.chip_variant = esp32p4_es
board_build.flash_mode = qio
board_build.boot = qio
board_build.f_cpu = 360000000L
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DTSPS_WAVESHARE_3C4=1
  -DTSPS_BACKLIGHT_PIN=-1
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DWHEEL_CIRCUMFERENCE_M=2.1f
  -DSPEED_PULSES_PER_REV=1.0f
  -I${PROJECT_DIR}/../esp32_p4_common/include

[env:esp32-p4-speedo-waveshare4c]
platform = https://github.com/pioarduino/platform-espressif32.git
board = esp32-p4-evboard
framework = arduino
extra_scripts = pre:pre_extra_script.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.6.0
  file://../esp32_p4_common
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DSENSOR_UART_RX=5
  -DSENSOR_UART_TX=4
  -DTSPS_USE_JD9365=1
  -DTSPS_BACKLIGHT_PIN=-1
  -DTSPS_BACKLIGHT_USE_PWM=1
  -DWHEEL_CIRCUMFERENCE_M=2.1f
  -DSPEED_PULSES_PER_REV=1.0f
  -I${PROJECT_DIR}/../esp32_p4_common/include
