# METABEGIN
# X-Env-Layer-Name: elc-app-image
# X-Env-Layer-Desc: Install El Camino runtime, services, UI, and boot splash.
# X-Env-Layer-Category: app
# X-Env-Layer-Version: 1.0.0
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu
      for hook in \
        10-install-packages.sh \
        20-configure-boot.sh \
        25-configure-ui-session.sh \
        30-install-runtime.sh \
        40-install-systemd.sh \
        50-install-boot-splash.sh; do
        ELC_ROOTFS_DIR="$1" bash "${SRCROOT}/hooks/${hook}"
      done
