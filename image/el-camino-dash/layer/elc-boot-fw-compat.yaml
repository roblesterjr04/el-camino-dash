# METABEGIN
# X-Env-Layer-Name: elc-boot-fw-compat
# X-Env-Layer-Desc: Conservative Pi4 firmware boot compatibility tweaks.
# X-Env-Layer-Category: device
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: rpi-boot-firmware
# METAEND
---
mmdebstrap:
  customize-hooks:
    - |-
      set -eu

      BOOT_DIR="$1/boot/firmware"
      if [ ! -d "$BOOT_DIR" ]; then
        BOOT_DIR="$1/boot"
      fi

      CONFIG_TXT="$BOOT_DIR/config.txt"
      CMDLINE_TXT="$BOOT_DIR/cmdline.txt"

      if [ ! -f "$CONFIG_TXT" ] || [ ! -f "$CMDLINE_TXT" ]; then
        echo "Boot fw-compat layer: boot config files not found, skipping." >&2
        exit 0
      fi

      remove_exact_line() {
        file="$1"
        line="$2"
        tmp="${file}.tmp.$$"
        grep -Fvx "$line" "$file" > "$tmp" || true
        mv "$tmp" "$file"
      }

      append_line_if_missing() {
        file="$1"
        line="$2"
        if ! grep -Fqx "$line" "$file"; then
          printf "\n%s\n" "$line" >> "$file"
        fi
      }

      remove_token_prefix() {
        file="$1"
        prefix="$2"
        current="$(cat "$file")"
        updated="$(printf "%s\n" "$current" | sed -E "s/(^| )${prefix}[^ ]*//g; s/  +/ /g; s/^ //; s/ $//")"
        printf "%s\n" "$updated" > "$file"
      }

      ensure_token() {
        file="$1"
        token="$2"
        current="$(cat "$file")"
        case " $current " in
          *" $token "*) ;;
          *) printf "%s %s\n" "$current" "$token" > "$file" ;;
        esac
      }

      # Remove full KMS requirement to avoid display init regressions.
      remove_exact_line "$CONFIG_TXT" "dtoverlay=vc4-kms-v3d"
      remove_exact_line "$CONFIG_TXT" "max_framebuffers=2"

      # Keep first-stage firmware display path conservative.
      append_line_if_missing "$CONFIG_TXT" "hdmi_force_hotplug=1"
      append_line_if_missing "$CONFIG_TXT" "hdmi_safe=1"
      append_line_if_missing "$CONFIG_TXT" "hdmi_force_mode=1"
      append_line_if_missing "$CONFIG_TXT" "hdmi_group=2"
      append_line_if_missing "$CONFIG_TXT" "hdmi_mode=82"
      append_line_if_missing "$CONFIG_TXT" "arm_64bit=1"
      append_line_if_missing "$CONFIG_TXT" "kernel=kernel8.img"
      append_line_if_missing "$CONFIG_TXT" "enable_uart=1"
      append_line_if_missing "$CONFIG_TXT" "boot_delay=1"

      # Keep logs visible and avoid over-trimmed boot args.
      remove_token_prefix "$CMDLINE_TXT" "quiet"
      remove_token_prefix "$CMDLINE_TXT" "splash"
      remove_token_prefix "$CMDLINE_TXT" "console="
      remove_token_prefix "$CMDLINE_TXT" "systemd.unit="
      ensure_token "$CMDLINE_TXT" "console=tty1"
      ensure_token "$CMDLINE_TXT" "systemd.unit=multi-user.target"
