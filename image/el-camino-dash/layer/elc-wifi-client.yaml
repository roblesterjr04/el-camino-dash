# METABEGIN
# X-Env-Layer-Name: elc-wifi-client
# X-Env-Layer-Desc: Configure Wi-Fi client using NetworkManager (Bookworm).
# X-Env-Layer-Category: device
# X-Env-Layer-Version: 1.0.0
# X-Env-Layer-Requires: systemd-net-min
#
# X-Env-VarPrefix: wifi
#
# X-Env-Var-iface: wlan0
# X-Env-Var-iface-Desc: Wireless interface name to configure.
# X-Env-Var-iface-Required: n
# X-Env-Var-iface-Valid: string
# X-Env-Var-iface-Set: y
#
# X-Env-Var-country: US
# X-Env-Var-country-Desc: Two-letter Wi-Fi regulatory country code.
# X-Env-Var-country-Required: n
# X-Env-Var-country-Valid: regex:^[A-Z]{2}$
# X-Env-Var-country-Set: y
#
# X-Env-Var-ssid:
# X-Env-Var-ssid-Desc: Wi-Fi SSID for station mode.
# X-Env-Var-ssid-Required: y
# X-Env-Var-ssid-Valid: string
# X-Env-Var-ssid-Set: y
#
# X-Env-Var-psk:
# X-Env-Var-psk-Desc: Wi-Fi passphrase for WPA/WPA2.
# X-Env-Var-psk-Required: y
# X-Env-Var-psk-Valid: string
# X-Env-Var-psk-Set: y
# METAEND
---
mmdebstrap:
  packages:
    - network-manager
    - wpasupplicant
    - wireless-regdb
    - iw
    - rfkill
    - iproute2
  customize-hooks:
    - |-
      set -eu
      install -d "$1/etc/NetworkManager/system-connections"
      install -d "$1/etc/NetworkManager/conf.d"

      # Run the exact requested nmcli connect command during build.
      # In chroot/image builds there is typically no live Wi-Fi device, so
      # this is expected to be best-effort only.
      chroot "$1" /bin/bash -lc \
        "nmcli dev wifi connect \"${IGconf_wifi_ssid}\" password \"${IGconf_wifi_psk}\" >/dev/null 2>&1 || true"

      # Deterministically create the NetworkManager profile offline so first
      # boot autoconnect works even when no device exists at build time.
      chroot "$1" /bin/bash -lc \
        "nmcli --offline connection add \
          type wifi \
          con-name elc-wifi \
          connection.autoconnect yes \
          ssid \"${IGconf_wifi_ssid}\" \
          wifi-sec.key-mgmt wpa-psk \
          wifi-sec.psk \"${IGconf_wifi_psk}\" \
          ipv4.method auto \
          ipv6.method auto \
          > /etc/NetworkManager/system-connections/elc-wifi.nmconnection"
      # Never pin to wlan0; device names vary on Bookworm.
      sed -i '/^[[:space:]]*interface-name=/d' "$1/etc/NetworkManager/system-connections/elc-wifi.nmconnection"
      chmod 600 "$1/etc/NetworkManager/system-connections/elc-wifi.nmconnection"
      chroot "$1" chown root:root /etc/NetworkManager/system-connections/elc-wifi.nmconnection || true

      # Ensure NetworkManager manages interfaces even if ifupdown config exists.
      cat > "$1/etc/NetworkManager/conf.d/10-elc-managed.conf" <<'EOF'
      [ifupdown]
      managed=true
      EOF
      cat > "$1/etc/NetworkManager/conf.d/20-elc-wifi.conf" <<'EOF'
      [device]
      wifi.scan-rand-mac-address=no
      EOF

      # Remove potential interface stanzas that can make NM ignore wlan devices.
      if [ -f "$1/etc/network/interfaces" ]; then
        cat > "$1/etc/network/interfaces" <<'EOF'
      auto lo
      iface lo inet loopback
      EOF
      fi

      # Set regulatory domain in a simple form used by common Wi-Fi tooling.
      cat > "$1/etc/default/crda" <<EOF
      REGDOMAIN=${IGconf_wifi_country}
      EOF

      # Prefer NetworkManager on Bookworm; disable competing network stacks.
      install -d "$1/etc/systemd/system/multi-user.target.wants"
      if [ -f "$1/usr/lib/systemd/system/NetworkManager.service" ]; then
        ln -sf /usr/lib/systemd/system/NetworkManager.service \
          "$1/etc/systemd/system/multi-user.target.wants/NetworkManager.service"
      elif [ -f "$1/lib/systemd/system/NetworkManager.service" ]; then
        ln -sf /lib/systemd/system/NetworkManager.service \
          "$1/etc/systemd/system/multi-user.target.wants/NetworkManager.service"
      fi
      if [ -f "$1/usr/lib/systemd/system/systemd-resolved.service" ]; then
        ln -sf /usr/lib/systemd/system/systemd-resolved.service \
          "$1/etc/systemd/system/multi-user.target.wants/systemd-resolved.service"
      elif [ -f "$1/lib/systemd/system/systemd-resolved.service" ]; then
        ln -sf /lib/systemd/system/systemd-resolved.service \
          "$1/etc/systemd/system/multi-user.target.wants/systemd-resolved.service"
      fi

      cat > "$1/etc/systemd/system/elc-wifi-radio-on.service" <<'EOF'
      [Unit]
      Description=Force Wi-Fi radio on and connect profile
      After=NetworkManager.service
      Wants=NetworkManager.service

      [Service]
      Type=simple
      ExecStart=/bin/bash -lc 'set -e; LOG=/boot/elc-wifi-boot.log; [ -d /boot/firmware ] && LOG=/boot/firmware/elc-wifi-boot.log; : > "$LOG"; echo "[elc] wifi bootstrap start" >> "$LOG"; rfkill unblock wifi || true; nmcli radio wifi on || true; for i in $(seq 1 60); do echo "[elc] connect attempt $i" >> "$LOG"; if nmcli -w 8 connection up elc-wifi >>"$LOG" 2>&1; then echo "[elc] connected" >> "$LOG"; break; fi; sleep 2; done; nmcli -f DEVICE,TYPE,STATE,CONNECTION device >>"$LOG" 2>&1 || true; nmcli -f NAME,UUID,TYPE,DEVICE connection show --active >>"$LOG" 2>&1 || true'

      [Install]
      WantedBy=multi-user.target
      EOF
      ln -sf /etc/systemd/system/elc-wifi-radio-on.service \
        "$1/etc/systemd/system/multi-user.target.wants/elc-wifi-radio-on.service"

      rm -f "$1/etc/systemd/system/multi-user.target.wants/systemd-networkd.service"
      rm -f "$1/etc/systemd/system/multi-user.target.wants/wpa_supplicant.service"
      rm -f "$1/etc/systemd/system/network-online.target.wants/systemd-networkd-wait-online.service"
      rm -f "$1/etc/systemd/system/sockets.target.wants/systemd-networkd.socket"
      # Keep NetworkManager as single owner of interfaces.
      ln -sf /dev/null "$1/etc/systemd/system/systemd-networkd.service"
      ln -sf /dev/null "$1/etc/systemd/system/systemd-networkd.socket"
      ln -sf /dev/null "$1/etc/systemd/system/systemd-networkd-wait-online.service"
